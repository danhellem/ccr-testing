<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Map of Contoso HQ in Springfield, OR">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Land background -->
  <rect width="600" height="400" fill="#e8f0e3"/>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- Park / green space -->
  <path d="M40,260 Q120,220 200,250 T360,240 Q420,260 460,300 L460,380 L40,380 Z" fill="#c7e0b4" opacity="0.85"/>

  <!-- River -->
  <path d="M0,120 C120,100 220,160 320,140 S520,180 600,150 L600,180 C520,210 380,170 280,200 S100,180 0,160 Z" fill="#a7d8f0"/>
  <text x="60" y="145" font-family="Georgia, serif" font-size="12" fill="#2c5d7a" font-style="italic">Willamette River</text>

  <!-- Roads -->
  <line x1="0" y1="220" x2="600" y2="220" stroke="#ffffff" stroke-width="10"/>
  <line x1="0" y1="220" x2="600" y2="220" stroke="#94a3b8" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="400" stroke="#ffffff" stroke-width="10"/>
  <line x1="300" y1="0" x2="300" y2="400" stroke="#94a3b8" stroke-width="1"/>
  <line x1="0" y1="320" x2="600" y2="320" stroke="#ffffff" stroke-width="6"/>
  <line x1="120" y1="0" x2="120" y2="400" stroke="#ffffff" stroke-width="6"/>
  <line x1="480" y1="0" x2="480" y2="400" stroke="#ffffff" stroke-width="6"/>

  <!-- Road labels -->
  <text x="10" y="216" font-family="Arial, sans-serif" font-size="11" fill="#475569" font-weight="600">Main St</text>
  <text x="306" y="14" font-family="Arial, sans-serif" font-size="11" fill="#475569" font-weight="600">Pioneer Pkwy</text>
  <text x="10" y="316" font-family="Arial, sans-serif" font-size="11" fill="#475569">42nd St</text>
  <text x="486" y="14" font-family="Arial, sans-serif" font-size="11" fill="#475569">Mohawk Blvd</text>

  <!-- Building blocks -->
  <rect x="60" y="240" width="50" height="40" fill="#fde68a" stroke="#ca8a04" stroke-width="1"/>
  <rect x="160" y="240" width="60" height="40" fill="#fde68a" stroke="#ca8a04" stroke-width="1"/>
  <rect x="340" y="240" width="40" height="40" fill="#fde68a" stroke="#ca8a04" stroke-width="1"/>
  <rect x="400" y="240" width="60" height="40" fill="#fde68a" stroke="#ca8a04" stroke-width="1"/>
  <rect x="60" y="340" width="50" height="40" fill="#fde68a" stroke="#ca8a04" stroke-width="1"/>
  <rect x="340" y="340" width="80" height="40" fill="#fde68a" stroke="#ca8a04" stroke-width="1"/>

  <!-- HQ Pin -->
  <g transform="translate(300,220)">
    <circle r="22" fill="#ffffff" opacity="0.85"/>
    <path d="M0,-30 C-12,-30 -20,-22 -20,-10 C-20,4 0,24 0,24 C0,24 20,4 20,-10 C20,-22 12,-30 0,-30 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.5"/>
    <circle cy="-12" r="6" fill="#ffffff"/>
    <text y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700">Contoso HQ</text>
    <text y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">742 Evergreen Terrace</text>
  </g>

  <!-- Compass -->
  <g transform="translate(550,50)">
    <circle r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <polygon points="0,-16 5,0 0,16 -5,0" fill="#475569"/>
    <polygon points="0,-16 5,0 0,0" fill="#ef4444"/>
    <text y="-26" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569" font-weight="700">N</text>
  </g>

  <!-- Scale bar -->
  <g transform="translate(30,370)">
    <rect width="80" height="6" fill="#0f172a"/>
    <rect x="40" width="40" height="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
    <text x="0" y="-4" font-family="Arial, sans-serif" font-size="10" fill="#0f172a">0</text>
    <text x="80" y="-4" font-family="Arial, sans-serif" font-size="10" fill="#0f172a">500 ft</text>
  </g>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="599" height="399" fill="none" stroke="#94a3b8" stroke-width="1"/>
</svg>
